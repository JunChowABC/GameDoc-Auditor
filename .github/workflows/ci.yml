name: Validate GameDoc Auditor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/engine.js && node --check dist/app.js && node --check dist/relations.js && node --check dist/graph.js && node --check dist/importer.js
      - run: node --test tests/*.test.cjs
